name: Volley
description: >-
  Volley is a San Francisco voice-AI entertainment company, backed by Lightspeed
  Venture Partners, that builds voice-controlled and connected-TV games. Its catalog
  includes hits such as Song Quiz, Yes Sire, and officially licensed titles like
  Jeopardy!, Wheel of Fortune, and Family Feud, playable on Amazon Alexa, Google
  Assistant, Roku, Fire TV, LG, and Samsung TVs. The company is rebranding its
  consumer surface as "Weekend." Volley operates as a consumer entertainment
  product studio and does not publish a public developer API; this profile captures
  its identity and public web properties for the API Evangelist network.
